<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Les uns sur les autres</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div id="load-overlay" role="status" aria-live="polite" aria-busy="true" aria-label="Chargement">
    <div class="load-card">
      <p class="load-text" id="load-text">Ça carto-charge…</p>
      <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="load-bar-fill" class="load-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="intro-modal" class="intro-modal" hidden role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro-card">
      <h1 id="intro-title">Les uns sur les autres</h1>
      <p class="lead" id="intro-lead">Retrouvez les 2 pays empilés en 30 secondes</p>

      <p class="field-label">Territoire</p>
      <div class="choice-grid" role="group" aria-label="Territoire">
        <button type="button" data-territory="world" aria-pressed="true">Pays du monde</button>
        <button type="button" data-territory="us" aria-pressed="false">États-Unis</button>
      </div>

      <p class="field-label">Difficulté</p>
      <div class="mode-switch mode-switch-3" role="group" aria-label="Difficulté">
        <button type="button" data-difficulty="normal" aria-pressed="true">Normale</button>
        <button type="button" data-difficulty="hard" aria-pressed="false">Difficile</button>
        <button type="button" data-difficulty="hyper" aria-pressed="false">Hyper difficile</button>
      </div>

      <p class="field-label">Rythme</p>
      <div class="mode-switch mode-switch-3 pace-switch" role="group" aria-label="Rythme">
        <button type="button" data-ms="30000" aria-pressed="true">À la cool</button>
        <button type="button" data-ms="20000" aria-pressed="false">Stressant</button>
        <button type="button" data-ms="10000" aria-pressed="false">Hyper stressant</button>
      </div>

      <p class="field-label">Partie</p>
      <div class="mode-switch" role="group" aria-label="Longueur de la partie">
        <button type="button" data-length="5" aria-pressed="true">5 manches</button>
        <button type="button" data-length="10" aria-pressed="false">10 manches</button>
      </div>

      <button type="button" id="btn-start" class="btn-primary">Je me lance</button>
    </div>
  </div>

  <div id="timer-block" class="timer-block" hidden aria-label="Temps restant">
    <div class="timer-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div id="timer-fill" class="timer-fill">
        <span class="timer-value" id="timer-value">30 s</span>
      </div>
    </div>
  </div>

  <header id="chrome" hidden>
    <p class="round-meta" id="round-kicker">Manche 1 / 5</p>
    <p class="round-prompt" id="score-line">Score 0</p>
  </header>

  <aside id="history-wrap" class="score-history-wrap" hidden aria-label="Votre partie">
    <p class="score-history-heading">Votre partie</p>
    <ul id="history" class="score-history"></ul>
  </aside>

  <div id="stage" hidden>
    <div class="stack-frame" id="stack-frame">
      <svg id="stack" viewBox="0 0 100 100" role="img" aria-label="Silhouettes superposées">
        <g id="pieces"></g>
      </svg>
      <button type="button" id="btn-split" class="split-btn" hidden title="Rejouer l'animation" aria-label="Rejouer l'animation">
        <svg viewBox="0 0 90 90" aria-hidden="true">
          <path fill="currentColor" d="M73 6 53 1 53 6 54 6 54 9 55 9 55 12 56 12 56 16 57 16 57 19 58 19 59 26 60 26 62 34 68 28 70 28 70 30 72 31 72 33 74 35 74 39 75 39 75 53 74 53 74 56 73 56 71 62 68 64 68 66 66 68 64 68 62 71 60 71 60 72 58 72 56 74 52 74 52 75 38 75 38 74 32 73 31 71 29 71 28 69 26 69 23 66 23 64 20 62 20 60 19 60 19 58 17 56 17 52 16 52 16 38 17 38 17 35 18 35 20 29 23 27 23 25 25 23 27 23 29 20 35 18 35 14 34 14 32 3 30 3 30 4 20 8 8 20 8 22 7 22 7 24 6 24 5 28 4 28 4 31 3 31 3 34 2 34 2 38 1 38 1 54 2 54 3 62 5 64 7 70 20 83 22 83 22 84 24 84 24 85 26 85 28 87 31 87 31 88 34 88 34 89 38 89 38 90 54 90 54 89 62 88 64 86 68 85 73 80 75 80 79 76 79 74 82 72 82 70 84 69 84 67 85 67 85 65 87 63 88 57 89 57 90 37 89 37 89 34 88 34 88 30 87 30 87 28 85 26 85 23 80 18 80 15 86 9Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="dock" hidden>
    <div class="dock-card">
      <div id="ask">
        <p class="round-prompt" id="ask-label">Encore 2 pays</p>
        <form id="guess-form">
          <div class="guess-row">
            <div class="guess-wrap" id="guess-wrap">
              <label class="sr-only" for="guess">Votre réponse</label>
              <input id="guess" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Un pays…">
              <ul id="suggest" role="listbox" hidden></ul>
            </div>
            <button type="submit" id="btn-validate" class="btn-primary">Valider</button>
          </div>
          <p class="guess-hint" id="guess-hint" aria-live="polite"></p>
        </form>
      </div>
      <div id="feedback" hidden>
        <p class="feedback-kicker" id="feedback-kicker">Bravo !</p>
        <p class="result-detail" id="feedback-detail"></p>
        <button type="button" id="btn-next" class="btn-primary btn-block">Manche suivante</button>
      </div>
    </div>
  </div>

  <div id="finish-modal" class="intro-modal" hidden role="dialog" aria-modal="true" aria-labelledby="finish-title">
    <div class="intro-card finish-card">
      <h1 id="finish-title">Partie terminée</h1>
      <p class="final-score-kicker">Score</p>
      <p class="final-score" id="final-score">—</p>
      <p class="finish-pace" id="finish-pace"></p>
      <ul class="finish-recap" id="finish-recap" aria-label="Bilan des manches"></ul>
      <button type="button" id="btn-replay" class="btn-primary">Rejouer</button>
    </div>
  </div>

  <script src="app.js?v=11"></script>
</body>
</html>
